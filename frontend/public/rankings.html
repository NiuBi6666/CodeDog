<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon-dog-20260913.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>C++ 冒险者积分中心 - CodeDog</title>
  <link rel="stylesheet" href="/rankings.css">
</head>
<body>
  <div class="adventure-shell">
    <header class="adventure-header">
      <a class="adventure-brand" href="/index" aria-label="返回 CodeDog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 11h4M8 9v4M15 12h.01M18 10h.01M7 5h10a5 5 0 0 1 4.8 6.4l-1.2 4A3 3 0 0 1 17.7 18h-.8a3 3 0 0 1-2.1-.9L13.7 16h-3.4l-1.1 1.1a3 3 0 0 1-2.1.9h-.8a3 3 0 0 1-2.9-2.6l-1.2-4A5 5 0 0 1 7 5Z"/></svg>
        <span>C++ 冒险者积分中心</span>
      </a>
      <div class="player-console">
        <span id="currentAvatar" class="player-avatar">?</span>
        <label><span>当前学员</span><select id="myStudentSelect" aria-label="选择我的姓名"><option value="">选择姓名</option></select></label>
        <div class="player-score"><small id="currentLevel">等待数据</small><strong id="currentPoints">0 积分</strong></div>
        <button id="fullscreenButton" class="fullscreen-button" type="button" title="全屏显示" aria-label="全屏显示"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M3 3l5 5M16 3h3a2 2 0 0 1 2 2v3M21 3l-5 5M8 21H5a2 2 0 0 1-2-2v-3M3 21l5-5M16 21h3a2 2 0 0 0 2-2v-3M21 21l-5-5"/></svg></button>
      </div>
    </header>

    <main class="ranking-layout">
      <section class="game-panel ladder-panel" aria-labelledby="ladderTitle">
        <div class="panel-heading">
          <div><span class="panel-icon">🏆</span><div><h1 id="ladderTitle">全员积分天梯榜</h1><p id="boardSubtitle">老师名下全部学员统一排序</p></div></div>
          <button id="refreshButton" class="ghost-button" type="button">刷新</button>
        </div>
        <div id="status" class="status" role="status" aria-live="polite">正在加载排行榜…</div>
        <div id="nameWall" class="ladder-list" aria-label="全部学生排名" hidden></div>
      </section>

      <section class="game-panel supply-panel" aria-labelledby="supplyTitle">
        <div class="panel-heading"><div><span class="panel-icon">🎒</span><div><h2 id="supplyTitle">积分补给站</h2><p>查看当前学员的积分构成与升级进度</p></div></div></div>
        <div class="supply-grid">
          <article class="supply-card"><span class="supply-icon supply-cyan">✓</span><h3>课程完课积分</h3><strong id="completionPoints">0 积分</strong><button class="supply-action" type="button">查看明细</button></article>
          <article class="supply-card"><span class="supply-icon supply-pink">⌨</span><h3>课上作业积分</h3><strong id="inclassPoints">0 积分</strong><button class="supply-action" type="button">查看明细</button></article>
          <article class="supply-card"><span class="supply-icon supply-green">🎮</span><h3>课后作业积分</h3><strong id="homeworkPoints">0 积分</strong><button class="supply-action" type="button">查看明细</button></article>
          <article class="supply-card"><span class="supply-icon supply-gold">★</span><h3 id="nextLevelName">下一等级</h3><strong id="nextLevelPoints">等待数据</strong><button class="supply-action" type="button">查看明细</button></article>
        </div>
        <div class="adventure-tip"><span>!</span><p id="motivationText">选择姓名后查看升级目标</p></div>
      </section>
    </main>

    <footer><span id="lastUpdated">尚未同步</span><span>全部学生统一排名 · 每 60 秒自动刷新</span></footer>
  </div>
  <div id="scorePopover" class="score-popover" role="tooltip" hidden></div>
  <script type="module" src="/rankings.js"></script>
</body>
</html>
