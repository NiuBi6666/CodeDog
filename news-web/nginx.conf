proxy_cache_path /var/cache/news-images levels=1:2 keys_zone=news_images:8m max_size=300m inactive=7d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=news_image_rate:1m rate=5r/s;
server {
 listen 80;
 root /usr/share/nginx/html;
 index index.html;
 resolver 127.0.0.11 valid=60s ipv6=off;
 location ^~ /news/assets/ { rewrite ^/news/(.*)$ /$1 break; try_files $uri =404; }
 location = /news/cdnews.svg { try_files /cdnews.svg =404; }
 location ~ ^/news/media/(preview|original)$ {
  limit_except GET { deny all; }
  limit_req zone=news_image_rate burst=20 nodelay;
  if ($arg_url !~ "^https%3[Aa]%2[Ff]%2[Ff]") { return 400; }
  set $image_options "";
  if ($uri = /news/media/preview) { set $image_options "&w=1200&fit=inside&we&output=webp"; }
  proxy_pass https://wsrv.nl/?url=$arg_url$image_options;
  proxy_set_header Host wsrv.nl;
  proxy_ssl_server_name on;
  proxy_ssl_name wsrv.nl;
  proxy_set_header Cookie "";
  proxy_set_header Authorization "";
  proxy_connect_timeout 4s;
  proxy_read_timeout 12s;
  proxy_cache news_images;
  proxy_cache_key "$uri:$arg_url";
  proxy_cache_valid 200 7d;
  proxy_cache_lock on;
  proxy_cache_lock_timeout 12s;
  proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
  proxy_cache_background_update on;
  proxy_ignore_headers Cache-Control Expires Set-Cookie;
  proxy_hide_header Set-Cookie;
  proxy_hide_header Cache-Control;
  add_header Cache-Control "public, max-age=86400";
  add_header X-Image-Cache $upstream_cache_status always;
  add_header X-Content-Type-Options nosniff always;
  add_header Content-Security-Policy "default-src 'none'; sandbox" always;
 }
 location ^~ /news/media/cnbc/ {
  limit_except GET { deny all; }
  limit_req zone=news_image_rate burst=20 nodelay;
  proxy_pass https://image.cnbcfm.com/;
  proxy_ssl_server_name on;
  proxy_set_header Host image.cnbcfm.com;
  proxy_set_header Cookie "";
  proxy_set_header Authorization "";
  proxy_connect_timeout 4s;
  proxy_read_timeout 12s;
  proxy_cache news_images;
  proxy_cache_valid 200 7d;
  proxy_cache_lock on;
  proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
  proxy_ignore_headers Cache-Control Expires Set-Cookie;
  proxy_hide_header Set-Cookie;
  proxy_hide_header Cache-Control;
  add_header Cache-Control "public, max-age=86400";
  add_header X-Image-Cache $upstream_cache_status always;
  add_header X-Content-Type-Options nosniff always;
  add_header Content-Security-Policy "default-src 'none'; sandbox" always;
 }
 location / { try_files $uri $uri/ /index.html; }
}
